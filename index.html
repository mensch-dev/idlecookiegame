<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Idle Cookie Game</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
    --bg-1: #1b1207;
    --bg-2: #2f1f10;
    --panel: rgba(18, 10, 4, 0.72);
    --panel-border: rgba(255, 198, 120, 0.22);
    --text: #fff5e6;
    --muted: #d0ba99;
    --accent: #ffbf57;
    --accent-2: #f68a2f;
    --danger: #ff6b6b;
    --shadow: 0 14px 36px rgba(0, 0, 0, 0.4);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    color: var(--text);
    font-family: "Manrope", sans-serif;
    background:
        radial-gradient(circle at 10% 10%, rgba(255, 195, 107, 0.09), transparent 40%),
        radial-gradient(circle at 85% 15%, rgba(255, 120, 48, 0.08), transparent 35%),
        linear-gradient(125deg, var(--bg-1), var(--bg-2));
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.3;
    background-image:
        linear-gradient(transparent 96%, rgba(255, 255, 255, 0.07) 96%),
        linear-gradient(90deg, transparent 96%, rgba(255, 255, 255, 0.05) 96%);
    background-size: 32px 32px;
}

.topbar {
    position: sticky;
    top: 0;
    z-index: 90;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 16px 28px;
    border-bottom: 1px solid var(--panel-border);
    background: rgba(19, 9, 3, 0.82);
    backdrop-filter: blur(8px);
}

.brand {
    margin: 0;
    font-family: "Bungee", cursive;
    font-size: clamp(1rem, 1vw + 0.8rem, 1.45rem);
    letter-spacing: 0.05em;
    color: #ffe6c5;
    text-decoration: none;
    white-space: nowrap;
}

.top-left {
    display: flex;
    align-items: center;
    gap: 20px;
}

.nav-link {
    border: 0;
    background: transparent;
    color: var(--muted);
    font-weight: 700;
    font-size: 0.96rem;
    cursor: pointer;
    padding: 8px 12px;
    border-radius: 9px;
    transition: background 0.18s ease, color 0.18s ease;
}

.nav-link:hover,
.nav-link.active {
    color: #101010;
    background: var(--accent);
}

.search-shell {
    position: relative;
    width: min(380px, 50vw);
}

#globalSearch {
    width: 100%;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 11px;
    background: rgba(255, 255, 255, 0.06);
    color: var(--text);
    padding: 10px 14px;
    font-size: 0.95rem;
    outline: none;
}

#globalSearch:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(255, 191, 87, 0.18);
}

.search-results {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    right: 0;
    border: 1px solid var(--panel-border);
    border-radius: 11px;
    background: rgba(24, 13, 4, 0.97);
    box-shadow: var(--shadow);
    overflow: hidden;
}

.search-result {
    display: block;
    width: 100%;
    text-align: left;
    border: 0;
    background: transparent;
    color: var(--text);
    padding: 10px 12px;
    cursor: pointer;
}

.search-result:hover {
    background: rgba(255, 191, 87, 0.18);
}

.search-result.active {
    background: rgba(255, 191, 87, 0.28);
}

.search-result-row {
    display: flex;
    align-items: center;
    gap: 10px;
}

.search-result-avatar {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    object-fit: cover;
    background: rgba(255, 255, 255, 0.08);
    flex-shrink: 0;
}

.search-result-label {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.recent-header {
    padding: 8px 12px 4px;
    color: var(--muted);
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
}

.hidden {
    display: none !important;
}

main {
    width: min(1150px, calc(100% - 28px));
    margin: 30px auto;
    animation: fadeIn 0.26s ease;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(8px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.hero {
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    background: var(--panel);
    box-shadow: var(--shadow);
    padding: clamp(20px, 4vw, 36px);
}

.hero h1 {
    margin: 0;
    font-size: clamp(1.7rem, 2vw + 1rem, 2.8rem);
    line-height: 1.2;
}

.hero-brand {
    margin: 0 0 10px;
    font-family: "Bungee", cursive;
    font-size: clamp(1.45rem, 1.8vw + 1rem, 2.3rem);
    letter-spacing: 0.03em;
    color: #ffe5ba;
}

.hero p {
    margin-top: 10px;
    color: var(--muted);
    font-size: 1.02rem;
    max-width: 70ch;
}

.cta-row {
    margin-top: 18px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}

.btn {
    border: 0;
    border-radius: 10px;
    padding: 10px 14px;
    font-weight: 800;
    cursor: pointer;
}

.btn-primary {
    color: #1a1207;
    background: linear-gradient(130deg, var(--accent), var(--accent-2));
}

.btn-secondary {
    color: var(--text);
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid var(--panel-border);
}

.panel {
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    background: var(--panel);
    box-shadow: var(--shadow);
}

.leaderboard-shell {
    padding: 18px;
}

.section-title {
    margin: 0 0 14px;
    font-size: clamp(1.1rem, 1.1vw + 0.9rem, 1.5rem);
}

.tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
}

.tab-btn {
    border: 0;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.08);
    color: var(--text);
    font-weight: 700;
    cursor: pointer;
    padding: 9px 14px;
}

.tab-btn.active {
    background: var(--accent);
    color: #1f1409;
}

.board-list {
    display: grid;
    gap: 8px;
}

.row {
    display: grid;
    grid-template-columns: 62px 54px 1fr auto;
    align-items: center;
    gap: 12px;
    border-radius: 10px;
    padding: 10px;
    background: rgba(255, 255, 255, 0.05);
}

.rank {
    font-weight: 900;
    font-size: 1.05rem;
    color: #ffe1a4;
}

.row.top-1 {
    background: linear-gradient(120deg, rgba(255, 208, 117, 0.24), rgba(255, 255, 255, 0.06));
    box-shadow: inset 0 0 0 1px rgba(255, 215, 130, 0.28);
}

.row.top-2 {
    background: linear-gradient(120deg, rgba(221, 226, 234, 0.18), rgba(255, 255, 255, 0.05));
    box-shadow: inset 0 0 0 1px rgba(202, 211, 221, 0.2);
}

.row.top-3 {
    background: linear-gradient(120deg, rgba(191, 132, 83, 0.22), rgba(255, 255, 255, 0.05));
    box-shadow: inset 0 0 0 1px rgba(205, 146, 98, 0.24);
}

.avatar {
    width: 54px;
    height: 54px;
    border-radius: 10px;
    object-fit: cover;
    background: rgba(255, 255, 255, 0.08);
}

.username-link {
    color: var(--text);
    text-decoration: none;
    font-weight: 700;
}

.username-link:hover {
    color: #ffdca0;
}

.value {
    font-weight: 800;
}

.value-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
}

.rank-badge {
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #1b1207;
    background: linear-gradient(130deg, #ffd78f, #ffb74f);
    border-radius: 999px;
    padding: 4px 8px;
    white-space: nowrap;
}

.stat-chip {
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 0.02em;
    color: #101010;
    background: rgba(255, 255, 255, 0.82);
    border-radius: 999px;
    padding: 4px 8px;
    white-space: nowrap;
}

.pagination {
    display: flex;
    gap: 10px;
    align-items: center;
    justify-content: center;
    margin-top: 16px;
}

.page-pill {
    padding: 7px 11px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.08);
}

.profile {
    display: grid;
    grid-template-columns: minmax(280px, 340px) 1fr;
    gap: 16px;
}

.profile-main {
    display: grid;
    gap: 16px;
}

.profile-card {
    padding: 18px;
}

.profile-name {
    margin: 12px 0 4px;
    font-size: 1.45rem;
}

.meta {
    margin: 4px 0;
    color: var(--muted);
}

.meta a {
    color: #ffd28a;
}

.copy-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
}

.copy-btn {
    border: 1px solid var(--panel-border);
    background: rgba(255, 255, 255, 0.06);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 0.82rem;
    font-weight: 700;
    cursor: pointer;
}

.copy-btn:hover {
    background: rgba(255, 191, 87, 0.22);
}

.rank-grid,
.stats-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(110px, 1fr));
    gap: 10px;
}

.badge,
.stat-box {
    padding: 12px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.06);
}

.badge h4,
.stat-box h4 {
    margin: 0;
    font-size: 0.83rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
}

.badge p,
.stat-box p {
    margin: 6px 0 0;
    font-size: 1.08rem;
    font-weight: 800;
}

.notice {
    color: var(--muted);
    padding: 14px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.04);
}

.error {
    color: var(--danger);
}

.toast {
    position: fixed;
    right: 16px;
    bottom: 16px;
    z-index: 120;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--panel-border);
    background: rgba(20, 12, 6, 0.94);
    color: var(--text);
    box-shadow: var(--shadow);
}

.home-grid {
    display: grid;
    gap: 14px;
    margin-top: 18px;
    grid-template-columns: repeat(3, minmax(180px, 1fr));
}

.home-metric {
    border-radius: 12px;
    padding: 14px;
    background: rgba(255, 255, 255, 0.06);
}

.home-metric h4 {
    margin: 0;
    color: var(--muted);
    font-size: 0.82rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

.home-metric p {
    margin: 8px 0 0;
    font-size: 1.3rem;
    font-weight: 800;
}

.home-search-shell {
    flex: 1;
    width: auto;
    margin-top: 0;
}

.home-search-panel {
    margin-top: 14px;
    padding: 12px;
}

.home-search-row {
    display: flex;
    gap: 10px;
    align-items: stretch;
}

#homeSearch {
    width: 100%;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 11px;
    background: rgba(255, 255, 255, 0.04);
    color: var(--text);
    padding: 12px 14px;
    font-size: 1.02rem;
    outline: none;
}

#homeSearch:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(255, 191, 87, 0.18);
}

.home-search-btn {
    min-width: 120px;
    padding: 0 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border-radius: 10px;
}

.home-leaderboards-panel {
    margin-top: 14px;
    padding: 14px;
}

.home-boards-grid {
    display: grid;
    gap: 12px;
    grid-template-columns: repeat(3, minmax(220px, 1fr));
}

.home-board-card {
    border-radius: 12px;
    padding: 12px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
}

.home-board-title {
    margin: 0 0 10px;
    font-size: 0.98rem;
    color: #ffdba4;
    font-weight: 800;
}

.home-board-list {
    display: grid;
    gap: 8px;
}

.home-board-row {
    display: grid;
    grid-template-columns: 34px 1fr auto;
    align-items: center;
    gap: 8px;
    font-size: 0.93rem;
}

.home-board-rank {
    color: #ffe19f;
    font-weight: 900;
}

.home-board-user {
    display: flex;
    align-items: center;
    gap: 7px;
    min-width: 0;
}

.home-board-avatar {
    width: 20px;
    height: 20px;
    border-radius: 999px;
    object-fit: cover;
    flex-shrink: 0;
    background: rgba(255, 255, 255, 0.08);
}

.home-board-name {
    color: var(--text);
    text-decoration: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.home-board-name:hover {
    color: #ffe3b6;
}

.home-board-value {
    color: var(--muted);
    font-weight: 700;
}

@media (max-width: 930px) {
    .topbar {
        flex-wrap: wrap;
        padding: 14px;
    }

    .search-shell {
        width: 100%;
        order: 3;
    }

    .profile {
        grid-template-columns: 1fr;
    }

    .profile-main {
        grid-template-columns: 1fr;
    }

    .rank-grid,
    .stats-grid {
        grid-template-columns: repeat(2, minmax(120px, 1fr));
    }

    .home-grid {
        grid-template-columns: repeat(2, minmax(170px, 1fr));
    }

    .home-boards-grid {
        grid-template-columns: repeat(2, minmax(210px, 1fr));
    }
}

@media (max-width: 680px) {
    main {
        width: calc(100% - 14px);
    }

    .row {
        grid-template-columns: 42px 48px 1fr;
        gap: 8px;
    }

    .value-wrap {
        grid-column: 2 / -1;
        padding-left: 4px;
    }

    .rank-grid,
    .stats-grid {
        grid-template-columns: 1fr;
    }

    .home-grid {
        grid-template-columns: 1fr;
    }

    .home-boards-grid {
        grid-template-columns: 1fr;
    }

    .home-search-row {
        flex-direction: column;
    }

    .home-search-btn {
        width: 100%;
        min-height: 44px;
    }
}
</style>
</head>
<body>
<header class="topbar">
    <div class="top-left">
        <a href="/" class="brand" data-route="/">Idle Cookie Game</a>
        <button class="nav-link" data-route="/leaderboards" id="navLeaderboards">Leaderboards</button>
    </div>
    <div class="search-shell">
        <input id="globalSearch" type="text" placeholder="Search username...">
        <div id="searchResults" class="search-results hidden"></div>
    </div>
</header>

<main id="app"></main>
<div id="toast" class="toast hidden"></div>

<script>
const SUPABASE_URL = "https://ufotthtbatjqilnksxms.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVmb3R0aHRiYXRqcWlsbmtzeG1zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE0NTg2MjQsImV4cCI6MjA4NzAzNDYyNH0.b7yfBcbMqunmVreBFlIk2cWtmYBjBenb3cyF_nNgdqA";
const pageSize = 25;
const AVATAR_PLACEHOLDER = "https://via.placeholder.com/150x150?text=Player";
const leaderboardStats = ["cookies", "money", "rebirths"];
const RECENT_SEARCHES_KEY = "idle_cookie_recent_searches_v1";
const USE_HASH_ROUTING = true;
const avatarUrlCache = new Map();
const STAT_META = {
    cookies: { icon: "[CK]", label: "Cookies" },
    money: { icon: "[$]", label: "Money" },
    rebirths: { icon: "[RB]", label: "Rebirths" }
};

const state = {
    currentStat: "cookies",
    currentPage: 0,
    searchTimer: null,
    searchResults: [],
    selectedSearchIndex: -1,
    toastTimer: null
};

const app = document.getElementById("app");
const globalSearch = document.getElementById("globalSearch");
const searchResultsEl = document.getElementById("searchResults");
const toastEl = document.getElementById("toast");

function supabaseHeaders(extra = {}) {
    return {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`,
        ...extra
    };
}

function formatNumber(value) {
    const n = Number(value);
    return Number.isFinite(n) ? n.toLocaleString() : "0";
}

function formatStatValue(value) {
    const n = Number(value);
    if (Number.isFinite(n)) return n.toLocaleString();
    if (typeof value === "boolean") return value ? "True" : "False";
    return String(value);
}

function formatStatLabel(key) {
    return key
        .replace(/_/g, " ")
        .replace(/\b\w/g, char => char.toUpperCase());
}

function getRankBadgeLabel(rank) {
    if (rank <= 10) return "Top 10";
    if (rank <= 100) return "Top 100";
    if (rank <= 1000) return "Top 1K";
    return "";
}

function getTopRankClass(rank) {
    if (rank === 1) return "top-1";
    if (rank === 2) return "top-2";
    if (rank === 3) return "top-3";
    return "";
}

function getCurrentStatMeta() {
    return STAT_META[state.currentStat] || { icon: "[ST]", label: state.currentStat };
}

function formatDateTime(value) {
    let date = null;
    if (typeof value === "number" && Number.isFinite(value)) {
        const millis = value < 1000000000000 ? value * 1000 : value;
        date = new Date(millis);
    } else if (typeof value === "string") {
        const numeric = Number(value);
        if (Number.isFinite(numeric) && value.trim() !== "") {
            const millis = numeric < 1000000000000 ? numeric * 1000 : numeric;
            date = new Date(millis);
        } else {
            date = new Date(value);
        }
    }

    if (!date || Number.isNaN(date.getTime())) return String(value);
    return date.toLocaleString(undefined, {
        dateStyle: "medium",
        timeStyle: "short"
    });
}

function formatRelativeTime(value) {
    let date = null;
    if (typeof value === "number" && Number.isFinite(value)) {
        const millis = value < 1000000000000 ? value * 1000 : value;
        date = new Date(millis);
    } else if (typeof value === "string") {
        const parsed = Date.parse(value);
        if (!Number.isNaN(parsed)) date = new Date(parsed);
    }
    if (!date || Number.isNaN(date.getTime())) return "";

    const diffMs = Date.now() - date.getTime();
    const future = diffMs < 0;
    const absMs = Math.abs(diffMs);
    const minutes = Math.floor(absMs / 60000);
    const hours = Math.floor(absMs / 3600000);
    const days = Math.floor(absMs / 86400000);

    if (minutes < 1) return future ? "in moments" : "just now";
    if (minutes < 60) return future ? `in ${minutes}m` : `${minutes}m ago`;
    if (hours < 24) return future ? `in ${hours}h` : `${hours}h ago`;
    return future ? `in ${days}d` : `${days}d ago`;
}

function buildFallbackAvatarUrl(userId, size = 150) {
    const safe = encodeURIComponent(String(userId));
    const safeSize = Number(size) || 150;
    return `https://api.dicebear.com/9.x/glass/svg?seed=roblox-${safe}&size=${safeSize}`;
}

async function fetchRobloxAvatarUrl(userId, size = 150) {
    const safeUserId = encodeURIComponent(String(userId));
    const safeSize = Number(size) || 150;
    const cacheKey = `${safeUserId}:${safeSize}`;
    if (avatarUrlCache.has(cacheKey)) return avatarUrlCache.get(cacheKey);

    try {
        const res = await fetch(
            `https://thumbnails.roproxy.com/v1/users/avatar-headshot?userIds=${safeUserId}&size=${safeSize}x${safeSize}&format=Png&isCircular=false`
        );
        if (!res.ok) throw new Error(`Avatar request failed (${res.status})`);

        const payload = await res.json();
        const imageUrl = payload?.data?.[0]?.imageUrl;
        if (!imageUrl) throw new Error("Missing avatar image URL");

        avatarUrlCache.set(cacheKey, imageUrl);
        return imageUrl;
    } catch (err) {
        return buildFallbackAvatarUrl(userId, size);
    }
}

function hydrateAvatarImage(imgElement) {
    const userId = imgElement.dataset.userId;
    const size = Number(imgElement.dataset.avatarSize) || 150;
    if (!userId) return;

    fetchRobloxAvatarUrl(userId, size).then(url => {
        imgElement.src = url;
    });
}

function escapeHtml(value) {
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll("\"", "&quot;")
        .replaceAll("'", "&#39;");
}

function buildSearchResultButton(player) {
    const rawUsername = String(player.username || "");
    const username = escapeHtml(rawUsername);
    const encodedUsername = encodeURIComponent(rawUsername);
    const hasUserId = player.user_id !== null && player.user_id !== undefined && player.user_id !== "";
    const encodedUserId = hasUserId ? encodeURIComponent(String(player.user_id)) : "";
    const avatarMarkup = hasUserId
        ? `<img class="search-result-avatar" src="${buildFallbackAvatarUrl(player.user_id, 150)}" data-user-id="${encodeURIComponent(String(player.user_id))}" data-avatar-size="150" alt="${username}" onerror="this.src='${AVATAR_PLACEHOLDER}'">`
        : `<img class="search-result-avatar" src="${AVATAR_PLACEHOLDER}" alt="${username}">`;

    return `
        <button class="search-result" data-username="${encodedUsername}" data-user-id="${encodedUserId}">

function getRecentSearches() {
    try {
        const raw = localStorage.getItem(RECENT_SEARCHES_KEY);
        const parsed = JSON.parse(raw || "[]");
        if (!Array.isArray(parsed)) return [];

        return parsed
            .map(item => {
                if (typeof item === "string") {
                    return { username: item, user_id: null };
                }
                if (item && typeof item === "object" && typeof item.username === "string") {
                    return {
                        username: item.username,
                        user_id: item.user_id ?? null
                    };
                }
                return null;
            })
            .filter(Boolean);
    } catch (err) {
        return [];
    }
}

function setRecentSearches(items) {
    const normalized = items
        .map(item => ({
            username: String(item.username || "").trim(),
            user_id: item.user_id ?? null
        }))
        .filter(item => item.username);

    localStorage.setItem(RECENT_SEARCHES_KEY, JSON.stringify(normalized.slice(0, 8)));
}

function saveRecentSearch(username, userId = null) {
    const value = username.trim();
    if (!value) return;
    const current = getRecentSearches().filter(item => item.username.toLowerCase() !== value.toLowerCase());
    current.unshift({ username: value, user_id: userId ?? null });
    setRecentSearches(current);
}

async function enrichRecentSearchesWithUserIds(recentEntries) {
    const pending = recentEntries.map(async entry => {
        if (entry.user_id !== null && entry.user_id !== undefined && entry.user_id !== "") return entry;
        try {
            const result = await fetchSupabase("players", {
                select: "username,user_id",
                username: `ilike.${entry.username}`,
                limit: "1"
            });
            if (Array.isArray(result) && result.length) {
                return {
                    username: result[0].username || entry.username,
                    user_id: result[0].user_id ?? null
                };
            }
        } catch (err) {
        }
        return entry;
    });

    return Promise.all(pending);
}

function getRouteContext() {
    if (USE_HASH_ROUTING) {
        const rawHash = window.location.hash.startsWith("#") ? window.location.hash.slice(1) : "";
        const normalized = rawHash || "home";
        const [routePart, queryPart = ""] = normalized.split("?");
        const routeName = routePart.replace(/^\//, "").toLowerCase();

        if (routePart.startsWith("/")) {
            const pathname = routePart.replace(/\/+$/, "") || "/";
            return {
                pathname,
                searchParams: new URLSearchParams(queryPart)
            };
        }

        if (routeName === "leaderboards") {
            return {
                pathname: "/leaderboards",
                searchParams: new URLSearchParams(queryPart)
            };
        }

        if (routeName === "player") {
            const params = new URLSearchParams(queryPart);
            const username = params.get("username") || "";
            return {
                pathname: username ? `/player/${encodeURIComponent(username)}` : "/player/",
                searchParams: params
            };
        }

        return {
            pathname: "/",
            searchParams: new URLSearchParams(queryPart)
        };
    }

    return {
        pathname: window.location.pathname.replace(/\/+$/, "") || "/",
        searchParams: new URLSearchParams(window.location.search)
    };
}

function setRouteUrl(pathname, params = null, replace = false) {
    const method = replace ? "replaceState" : "pushState";
    const query = params && params.toString() ? `?${params.toString()}` : "";
    const safePath = pathname.replace(/\/+$/, "") || "/";

    if (USE_HASH_ROUTING) {
        const base = window.location.pathname;
        let hashRoute = "home";

        if (safePath === "/leaderboards") {
            hashRoute = `leaderboards${query}`;
        } else if (safePath.startsWith("/player/")) {
            const encodedUsername = safePath.slice("/player/".length);
            const username = decodeURIComponent(encodedUsername || "");
            const playerParams = new URLSearchParams();
            if (username) playerParams.set("username", username);
            hashRoute = `player${playerParams.toString() ? `?${playerParams.toString()}` : ""}`;
        }

        history[method]({}, "", `${base}#${hashRoute}`);
        return;
    }

    history[method]({}, "", `${safePath}${query}`);
}

function getRouteHref(pathname, params = null) {
    const safePath = pathname.replace(/\/+$/, "") || "/";
    const query = params && params.toString() ? `?${params.toString()}` : "";

    if (!USE_HASH_ROUTING) return `${safePath}${query}`;

    if (safePath === "/leaderboards") return `#leaderboards${query}`;
    if (safePath.startsWith("/player/")) {
        const encodedUsername = safePath.slice("/player/".length);
        const username = decodeURIComponent(encodedUsername || "");
        const playerParams = new URLSearchParams();
        if (username) playerParams.set("username", username);
        return `#player${playerParams.toString() ? `?${playerParams.toString()}` : ""}`;
    }

    return "#home";
}

async function fetchSupabase(path, params = {}, options = {}) {
    const query = new URLSearchParams(params);
    const url = `${SUPABASE_URL}/rest/v1/${path}?${query.toString()}`;
    const res = await fetch(url, {
        method: options.method || "GET",
        headers: supabaseHeaders(options.headers || {})
    });

    if (options.method === "HEAD") {
        return res;
    }

    let data = null;
    try {
        data = await res.json();
    } catch (err) {
        data = null;
    }

    if (!res.ok) {
        throw new Error((data && data.message) || `Request failed (${res.status})`);
    }

    return data;
}

function navigate(path) {
    const safePath = path.replace(/\/+$/, "") || "/";
    const route = getRouteContext();
    if (route.pathname === safePath) return;
    setRouteUrl(safePath, null, false);
    renderRoute();
}

function setupHomeSearch() {
    const input = document.getElementById("homeSearch");
    const list = document.getElementById("homeSearchResults");
    const button = document.getElementById("homeSearchBtn");

    let timer = null;
    let localResults = [];

    function renderLocalResults(results) {
        localResults = results;
        if (!results.length) {
            list.classList.add("hidden");
            list.innerHTML = "";
            return;
        }
        list.innerHTML = results.map(buildSearchResultButton).join("");
        list.classList.remove("hidden");
        list.querySelectorAll("img[data-user-id]").forEach(hydrateAvatarImage);
    }

    input.addEventListener("input", () => {
        clearTimeout(timer);
        const value = input.value.trim();
        timer = setTimeout(async () => {
            if (value.length < 2) {
                renderLocalResults([]);
                return;
            }
            try {
                const results = await fetchSupabase("players", {
                    select: "username,user_id",
                    username: `ilike.*${value}*`,
                    order: "username.asc",
                    limit: "8"
                });
                renderLocalResults(Array.isArray(results) ? results : []);
            } catch (err) {
                renderLocalResults([]);
            }
        }, 180);
    });

    input.addEventListener("keydown", evt => {
        if (evt.key === "Escape") {
            list.classList.add("hidden");
            return;
        }
        if (evt.key !== "Enter") return;
        evt.preventDefault();
        if (localResults.length) {
            goToUsernameFromSearch(localResults[0].username, localResults[0].user_id ?? null);
            return;
        }
        goToUsernameFromSearch(input.value);
    });

    if (button) {

            if (localResults.length) {
                goToUsernameFromSearch(localResults[0].username, localResults[0].user_id ?? null);
                return;
            }
            goToUsernameFromSearch(input.value);
        });
    }

function profileStatsFromPlayer(player) {
    const hiddenKeys = new Set(["id", "username", "user_id"]);
    const stats = [];

    Object.entries(player).forEach(([key, value]) => {
        if (hiddenKeys.has(key)) return;
        if (value === null || typeof value === "object") return;
        const isDateKey = /(_at|updated|created|last_login|timestamp)$/i.test(key);
        stats.push({
            key,
            value: isDateKey ? `${formatDateTime(value)} (${formatRelativeTime(value)})` : value
        });
    });

    return stats;
}

async function getRankForStat(stat, value) {
    const safeValue = Number.isFinite(Number(value)) ? Number(value) : 0;
    const res = await fetch(
        `${SUPABASE_URL}/rest/v1/players?select=user_id&${stat}=gt.${encodeURIComponent(safeValue)}&limit=1`,
        {
            headers: supabaseHeaders({ Prefer: "count=exact" })
        }
    );

    if (!res.ok) return "?";

    const range = res.headers.get("content-range") || "*/0";
    const total = Number((range.split("/")[1] || "0"));
    return Number.isFinite(total) ? total + 1 : "?";
}

async function fetchPlayerByUsername(username) {
    const exact = await fetchSupabase("players", {
        select: "*",
        username: `ilike.${username}`,
        limit: "1"
    });

    if (Array.isArray(exact) && exact.length) return exact[0];

    const fuzzy = await fetchSupabase("players", {
        select: "*",
        username: `ilike.*${username}*`,
        order: "username.asc",
        limit: "1"
    });

    if (Array.isArray(fuzzy) && fuzzy.length) return fuzzy[0];

    return null;
}

        }

        const [cookiesRank, moneyRank, rebirthsRank] = await Promise.all([
            getRankForStat("cookies", player.cookies),
            getRankForStat("money", player.money),
            getRankForStat("rebirths", player.rebirths)
        ]);

        renderProfile(player, {
            cookies: cookiesRank,
            money: moneyRank,
            rebirths: rebirthsRank
        });
    } catch (err) {
        app.innerHTML = `<section class="panel profile-card"><p class="notice error">Failed to load profile: ${err.message}</p></section>`;
    }
}

function renderRoute() {
    const { pathname } = getRouteContext();
    updateActiveNav(pathname);

    if (pathname === "/leaderboards") {
        applyLeaderboardQueryFromUrl();
        renderLeaderboardShell();
        loadLeaderboard();
        updateLeaderboardQuery(true);
        return;
    }

    if (pathname.startsWith("/player/")) {
        const encodedUsername = pathname.slice("/player/".length);
        if (!encodedUsername) {
            renderHome();
            return;
        }

        loadPlayerProfile(encodedUsername);
        return;
    }

    renderHome();
}

document.addEventListener("click", evt => {
    const routeTarget = evt.target.closest("[data-route]");
    if (routeTarget) {
        evt.preventDefault();
        navigate(routeTarget.dataset.route);
        return;
    }

    const resultTarget = evt.target.closest(".search-result");
    if (resultTarget) {
        const username = decodeURIComponent(resultTarget.dataset.username || "");
        const userId = resultTarget.dataset.userId ? decodeURIComponent(resultTarget.dataset.userId) : null;
        goToUsernameFromSearch(username, userId);
        return;
    }

    const copyTarget = evt.target.closest("[data-copy-text]");
    if (copyTarget) {
        const text = decodeURIComponent(copyTarget.dataset.copyText || "");
        const label = copyTarget.dataset.copyLabel || "Value";
        navigator.clipboard.writeText(text)
            .then(() => showToast(`${label} copied`))
            .catch(() => showToast("Copy failed"));
        return;
    }

    if (!evt.target.closest(".search-shell")) {
        hideSearchResults();
        hideHomeSearchResults();
    }
});

window.addEventListener("popstate", renderRoute);
window.addEventListener("hashchange", () => {
    if (!USE_HASH_ROUTING) return;
    renderRoute();
});

document.addEventListener("keydown", evt => {
    if (evt.key !== "/") return;
    const target = evt.target;
    const typingInField = target instanceof HTMLElement && (
        target.tagName === "INPUT" ||
        target.tagName === "TEXTAREA" ||
        target.isContentEditable
    );
    if (typingInField) return;

    evt.preventDefault();
    globalSearch.focus();
    globalSearch.select();
});

globalSearch.addEventListener("input", () => {
    clearTimeout(state.searchTimer);
    const value = globalSearch.value.trim();
    state.searchTimer = setTimeout(() => {
        if (value.length < 2) {
            renderRecentSearches();
            return;
        }
        searchUsernames(value);
    }, 180);
});

globalSearch.addEventListener("focus", () => {
    const value = globalSearch.value.trim();
    if (value.length < 2) {
        renderRecentSearches();
    }
});

globalSearch.addEventListener("keydown", evt => {
    const items = Array.from(searchResultsEl.querySelectorAll(".search-result"));

    if (evt.key === "ArrowDown") {
        if (!items.length) return;
        evt.preventDefault();
        const nextIndex = state.selectedSearchIndex < items.length - 1 ? state.selectedSearchIndex + 1 : 0;
        setSearchResultActive(nextIndex);
        return;
    }

    if (evt.key === "ArrowUp") {
        if (!items.length) return;
        evt.preventDefault();
        const prevIndex = state.selectedSearchIndex > 0 ? state.selectedSearchIndex - 1 : items.length - 1;
        setSearchResultActive(prevIndex);
        return;
    }

    if (evt.key === "Escape") {
        hideSearchResults();
        return;
    }

    if (evt.key !== "Enter") return;
    evt.preventDefault();

    if (state.selectedSearchIndex >= 0 && items[state.selectedSearchIndex]) {
        const selected = items[state.selectedSearchIndex];
        const username = decodeURIComponent(selected.dataset.username || "");
        const userId = selected.dataset.userId ? decodeURIComponent(selected.dataset.userId) : null;
        goToUsernameFromSearch(username, userId);
        return;
    }

    if (state.searchResults.length) {
        goToUsernameFromSearch(state.searchResults[0].username, state.searchResults[0].user_id ?? null);
        return;
    }

    goToUsernameFromSearch(globalSearch.value);
});

renderRoute();
</script>
</body>
</html>
